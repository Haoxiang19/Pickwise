<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping Agent</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; color: #1a1a1a; background: #fafafa; }
  h1 { font-size: 1.3rem; margin: 0 0 8px; }
  .sim { font-size: .85rem; color: #555; margin: 0 0 8px; }
  .badge { display: inline-block; font-size: .75rem; padding: 2px 8px; margin: 0 4px 4px 0; border-radius: 10px; background: #fff3cd; border: 1px solid #e0c060; }
  #log { margin: 12px 0; }
  .msg { padding: 8px 12px; margin: 8px 0; border-radius: 8px; white-space: pre-wrap; }
  .user { background: #e7f0ff; margin-left: 15%; }
  .bot { background: #fff; border: 1px solid #ddd; margin-right: 15%; }
  .card { background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
  .price { font-weight: 600; }
  .note { color: #8a5a00; }
  .summary { background: #fff; border: 2px solid #0070ba; border-radius: 8px; padding: 12px; margin: 8px 0; }
  .summary table { border-collapse: collapse; width: 100%; }
  .summary td { padding: 2px 0; }
  .summary td:last-child { text-align: right; }
  .result { border-radius: 8px; padding: 12px; margin: 8px 0; border: 2px solid #b00020; background: #fff; }
  .result.ok { border-color: #1e7e34; }
  #memory { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 4px 12px; margin: 8px 0; font-size: .9rem; }
  #memory li { margin: 4px 0; }
  #memory button { font-size: .8rem; padding: 2px 8px; margin-left: 6px; }
  .total td { font-weight: 700; border-top: 1px solid #ccc; padding-top: 6px; }
  details { margin: 8px 0; font-size: .9rem; }
  fieldset.card legend { font-weight: 600; padding: 0 4px; }
  .option { display: block; padding: 6px 0; border-top: 1px solid #eee; }
  .option:first-of-type { border-top: 0; }
  .option .reason { font-size: .9rem; color: #444; margin-left: 24px; }
  form { display: flex; gap: 8px; position: sticky; bottom: 0; background: #fafafa; padding: 8px 0; }
  input[type=text] { flex: 1; padding: 10px; font-size: 1rem; }
  button { padding: 8px 14px; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<h1>Shopping Agent</h1>
<p class="sim">Demo: products come from outside retailers, but payment goes to this project's own PayPal sandbox
merchant account. Orders are a concierge-style simulation: no real money moves and nothing ships.</p>
<div id="badges"></div>
<button id="new-chat" type="button">New conversation</button>
<details id="memory"><summary>What I remember</summary><ul id="memory-list"></ul></details>
<div id="log"></div>
<form id="form">
  <input id="input" type="text" placeholder="Describe what you need, e.g. running shoes under $100" autocomplete="off" required>
  <button id="send">Send</button>
</form>
<script>
const log = document.getElementById("log");

// Build elements with textContent only: product text is untrusted and must never be parsed as HTML.
function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}
const dollars = cents => "$" + (cents / 100).toFixed(2);
function add(node) { log.appendChild(node); node.scrollIntoView({block: "end"}); return node; }

async function api(path, body, method) {
  const options = method ? {method} : body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)};
  const res = await fetch(path, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}

function showRecommendations(data) {
  const box = add(el("div"));
  for (const r of data.recommendations || []) {
    const card = box.appendChild(el("div", undefined, "card"));
    card.appendChild(el("div", r.title + (r.brand ? " - " + r.brand : "")));
    card.appendChild(el("div", dollars(r.price_cents), "price"));
    card.appendChild(el("div", r.reason));
    const choose = card.appendChild(el("button", "Choose"));
    choose.onclick = async () => {
      try { showSummary(await api("/api/cart", {product_id: r.id, quantity: 1})); }
      catch (err) { add(el("div", "Error: " + err.message, "msg bot")); }
    };
  }
  if (data.budget_note) box.appendChild(el("p", data.budget_note, "note"));
  if (data.note) box.appendChild(el("p", data.note, "note"));
  showRejected(box, data.rejected);
}

// F6: what was ruled out and why. In a set (F22) each entry also names its item.
function showRejected(box, rejected) {
  if (!rejected || !rejected.length) return;
  const d = box.appendChild(el("details"));
  d.appendChild(el("summary", `Ruled out (${rejected.length})`));
  const ul = d.appendChild(el("ul"));
  for (const x of rejected) {
    ul.appendChild(el("li", `${x.item ? x.item + ": " : ""}${x.title} (${x.price_cents == null ? "no price" : dollars(x.price_cents)}): ${x.reason}`));
  }
}

// F22: a set, one group per item. The chosen product is preselected; the others are alternatives.
// The page never adds prices: the set total comes from the server, and a changed selection is
// priced by the server when the set is reviewed.
let setCount = 0;
function showBundle(set) {
  const box = add(el("div"));
  const groups = [];
  setCount += 1;
  const total = el("p", set.total_cents == null ? "" : "Set total: " + dollars(set.total_cents)
    + (set.budget_cents == null ? " (no budget limit)" : " (budget " + dollars(set.budget_cents) + ")"), "price");
  set.items.forEach((item, i) => {
    const group = box.appendChild(el("fieldset", undefined, "card"));
    group.appendChild(el("legend", item.quantity + " x " + item.name));
    for (const p of [item.chosen, ...item.alternatives]) {
      const label = group.appendChild(el("label", undefined, "option"));
      const radio = label.appendChild(el("input"));
      radio.type = "radio"; radio.name = `set${setCount}-item${i}`; radio.value = p.id; radio.checked = p === item.chosen;
      radio.onchange = () => { total.textContent = "The total is recalculated when you review the set."; };
      label.append(" " + p.title + (p.brand ? " - " + p.brand : "") + " ");
      label.appendChild(el("span", dollars(p.price_cents), "price"));
      label.appendChild(el("div", p.reason, "reason"));
    }
    groups.push({group, quantity: item.quantity});
  });
  if (set.items.length) box.appendChild(total);
  if (set.budget_note) box.appendChild(el("p", set.budget_note, "note"));
  if (set.note) box.appendChild(el("p", set.note, "note"));
  if (set.items.length) {
    const review = box.appendChild(el("button", "Review this set"));
    review.onclick = async () => {
      const items = groups.map(g => ({product_id: g.group.querySelector("input:checked").value, quantity: g.quantity}));
      // The server prices the cart and refuses a set over the budget; its message is shown as is.
      try { showSummary(await api("/api/cart", {items})); }
      catch (err) { add(el("div", "Error: " + err.message, "msg bot")); }
    };
  }
  showRejected(box, set.rejected);
}

// F8: order summary. Every number here comes from the server.
function showSummary(cart) {
  const box = add(el("div", undefined, "summary"));
  box.appendChild(el("strong", "Order summary"));
  const table = box.appendChild(el("table"));
  const row = (label, value, cls) => {
    const tr = table.appendChild(el("tr", undefined, cls));
    tr.appendChild(el("td", label)); tr.appendChild(el("td", value));
  };
  row("Product", "Unit price x quantity");
  for (const item of cart.items) row(item.title, dollars(item.unit_price_cents) + " x " + item.quantity);
  row("Total (" + cart.currency + ")", dollars(cart.total_cents), "total");
  for (const item of cart.items) {
    if (item.price_was_cents != null) {
      box.appendChild(el("p", "The price of " + item.title + " changed from " + dollars(item.price_was_cents) + " since the search. The total above is the current price.", "note"));
    }
  }
  box.appendChild(el("p", "Nothing is charged until you approve the payment on PayPal.", "note"));
  const pay = box.appendChild(el("button", "Confirm and pay with PayPal"));
  pay.onclick = async () => {
    pay.disabled = true;  // F12: one click only; the server also returns the same order on a repeat
    try {
      const order = await api("/api/confirm", {cart_id: cart.cart_id});
      window.location.href = order.approve_url;
    } catch (err) { add(el("div", "Error: " + err.message, "msg bot")); }
  };
  return box;
}

// F13, F14: result after returning from PayPal. Only reads the stored order; never captures.
function showOrder(order) {
  const box = add(el("div", undefined, "result" + (order.status === "COMPLETED" ? " ok" : "")));
  box.appendChild(el("strong", order.message));
  box.appendChild(el("div", "Order #" + order.order_id));
  const lines = box.appendChild(el("ol"));
  for (const i of order.items) lines.appendChild(el("li", i.quantity + " x " + i.title + (i.refunded ? " (refunded)" : "")));
  box.appendChild(el("div", "Total: " + dollars(order.amount_cents) + " " + order.currency));
  if (order.refunded_cents) box.appendChild(el("div", "Refunded: " + dollars(order.refunded_cents) + " " + order.currency));
  if (order.paypal_order_id) box.appendChild(el("div", "PayPal order ID: " + order.paypal_order_id));
  box.appendChild(el("div", "Status: " + order.status));
  if (order.status === "CREATED" && order.paypal_order_id) {
    const again = box.appendChild(el("a", "Check again"));
    again.href = "/paypal/return?order_id=" + encodeURIComponent(order.order_id);
  }
}

// F16, F23: refund draft, one row per line. PayPal is called only when the user clicks Confirm refund.
function showRefundDraft(draft) {
  const box = add(el("div", undefined, "summary"));
  box.appendChild(el("strong", "Refund for order #" + draft.order_id));
  const table = box.appendChild(el("table"));
  for (const l of draft.lines) {
    const tr = table.appendChild(el("tr"));
    tr.appendChild(el("td", "Line " + l.line + ": " + l.quantity + " x " + l.title));
    tr.appendChild(el("td", dollars(l.amount_cents)));
  }
  box.appendChild(el("div", "Amount: " + dollars(draft.amount_cents) + " " + draft.currency, "price"));
  box.appendChild(el("p", "Nothing is refunded until you click Confirm refund.", "note"));
  const button = box.appendChild(el("button", "Confirm refund"));
  button.onclick = async () => {
    button.disabled = true;  // one click only; the server also refuses a line that was already refunded
    const body = {lines: draft.lines.map(l => l.line)};  // exactly the lines this draft showed
    try { showOrder(await api("/api/orders/" + encodeURIComponent(draft.order_id) + "/refund", body)); }
    catch (err) { add(el("div", "Error: " + err.message, "msg bot")); }
  };
}

async function send(text) {
  add(el("div", text, "msg user"));
  const data = await api("/api/chat", {message: text});
  add(el("div", data.reply, "msg bot"));
  if (data.recommendations) showRecommendations(data);
  if (data.bundle) showBundle(data.bundle);
  if (data.cart) showSummary(data.cart);
  if (data.orders) data.orders.forEach(showOrder);
  if (data.refund_draft) showRefundDraft(data.refund_draft);
  if (data.memory_changed) loadMemory();
}

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const input = document.getElementById("input"), button = document.getElementById("send");
  const text = input.value.trim();
  if (!text) return;
  input.value = ""; button.disabled = true;
  try { await send(text); } catch (err) { add(el("div", "Error: " + err.message, "msg bot")); }
  button.disabled = false; input.focus();
});

// F20: view and delete saved preferences.
async function loadMemory() {
  const list = document.getElementById("memory-list");
  const prefs = await api("/api/memory");
  list.textContent = "";
  if (!prefs.length) list.appendChild(el("li", "Nothing yet. Tell me a lasting preference, e.g. \"I always buy Sony\"."));
  for (const p of prefs) {
    const li = list.appendChild(el("li", `${p.text} (strength ${p.strength.toFixed(1)})`));
    const del = li.appendChild(el("button", "Delete"));
    del.onclick = async () => {
      del.disabled = true;
      try { await api("/api/memory/" + p.id, null, "DELETE"); } catch (err) { add(el("div", "Error: " + err.message, "msg bot")); }
      loadMemory();
    };
  }
}

document.getElementById("new-chat").onclick = async () => {
  await api("/api/conversation/new", {});
  log.textContent = "";
  add(el("div", "New conversation started. Saved preferences will be used for recommendations.", "msg bot"));
};

loadMemory();

const returnedOrder = new URLSearchParams(location.search).get("order_id");
if (returnedOrder) {
  api("/api/orders/" + encodeURIComponent(returnedOrder)).then(showOrder)
    .catch(err => add(el("div", "Error: " + err.message, "msg bot")));
}

api("/api/status").then(s => {
  const badges = document.getElementById("badges");
  if (s.mock_llm) badges.appendChild(el("span", "Mock model (no LLM key)", "badge"));
  if (s.mock_catalog) badges.appendChild(el("span", "Mock catalog (no Channel3 key)", "badge"));
  if (s.mock_paypal) badges.appendChild(el("span", "Mock PayPal (no PayPal credentials)", "badge"));
});
</script>
</body>
</html>
